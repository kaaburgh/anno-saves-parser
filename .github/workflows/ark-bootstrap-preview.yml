name: ARK Bootstrap Preview

on:
  pull_request:
    paths:
      - ".agentic-repo.toml"
      - "docs/agent-policy.local.md"
      - ".github/workflows/ark-bootstrap-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download pinned ARK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/agentic-repo-kit-0.1.12.pyz" \
            https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.12/agentic-repo-kit-0.1.12.pyz
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "agentic-repo-kit-0.1.12.pyz"
          expected = "004708e14806f11e4cbe3751622403c92fb7022bb436876bdb76f339b7ec5e3c"
          actual = sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"ARK digest mismatch: expected {expected}, got {actual}")
          print(f"verified ARK sha256={actual}")
          PY

      - name: Inspect repository before bootstrap
        run: python "$RUNNER_TEMP/agentic-repo-kit-0.1.12.pyz" inspect .

      - name: Preview canonical bootstrap
        run: |
          python "$RUNNER_TEMP/agentic-repo-kit-0.1.12.pyz" bootstrap . --force
          python "$RUNNER_TEMP/agentic-repo-kit-0.1.12.pyz" check .

      - name: Existing parser validation
        run: |
          python -m compileall -q anno_save_probe.py tests
          python -m unittest discover -s tests -v

      - name: Capture generated contract
        uses: actions/upload-artifact@v4
        with:
          name: ark-generated-contract
          if-no-files-found: error
          include-hidden-files: true
          path: |
            AGENTS.md
            CLAUDE.md
            .agentic-repo.lock.json
            .github/copilot-instructions.md
            .github/pull_request_template.md
            .github/workflows/agentic-repo-check.yml
            docs/agent-playbook.md
            docs/roadmap-authoring.md
            docs/re/README.md
            docs/experiments/README.md

      - name: Show generated reconciliation diff
        run: git diff --exit-code
